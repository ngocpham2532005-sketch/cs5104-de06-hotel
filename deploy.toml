# CS5104 — Đề 6: Chuỗi khách sạn nghỉ dưỡng — bản đồ triển khai
# Trạm -> máy, IP, cổng. `make up MACHINE=A` / `make up MACHINE=B` đọc tệp này.
# Trước buổi demo: sửa machines.A.ip và machines.B.ip thành IP LAN thật của hai máy.
# Muốn thử trên một máy: DEPLOY=deploy.local.toml make all (xem deploy.local.toml).

[project]
de        = 6
image     = "cs5104-pg18"        # build từ docker/Dockerfile (postgres:18 + iproute2 cho tc netem)
db        = "hotel"
user      = "postgres"
password  = "cs5104"
central   = "nhatrang"           # trạm trung tâm: postgres_fdw + khung nhìn all_<bảng>
data_size = "lab"                # mini | lab
delay_ms  = 30

[machines.A]
os = "macOS"                     # chạy trạm trung tâm, dalat, CSDL đối chứng, giao diện, dashboard
ip = "192.168.100.218"

[machines.B]
os = "Windows 11"                # chạy phuquoc, danang
ip = "192.168.100.198"
# docker_ip = "..."              # (tuỳ chọn) địa chỉ mà container ở máy A dùng để tới máy B, mặc định = ip

# no = số thứ tự trạm, quyết định dải khoá chính cho dòng mới: booking_id ∈ [no·10^7 + 1, (no+1)·10^7 − 1]
[sites.dalat]
no = 1
machine = "A"
port = 5434

[sites.nhatrang]
no = 2
machine = "A"
port = 5433

[sites.phuquoc]
no = 3
machine = "B"
port = 5435

[sites.danang]
no = 4
machine = "B"
port = 5436

[ref]                            # CSDL tập trung đối chứng (lược đồ schema_central.sql, toàn bộ dữ liệu)
machine = "A"
port = 5440

# ---------------------------------------------------------------- PHẦN MỞ RỘNG (ngoài yêu cầu đề)
# Chỉ các lệnh `make ext-*` đọc mục này; `make all` và demo D1–D8 không dùng tới. Xem docs/NANG_CAO.md.
# E1: bản sao dự phòng (streaming replication) của trạm phuquoc (máy B), đặt ở máy A.
[ext.replica.phuquoc]
machine = "A"
port = 5445

# E3 — bảo mật đường truyền, MẶC ĐỊNH BẬT (`make all` tự cấp chứng chỉ; `make tls-off` để tạm tắt khi gỡ lỗi)
# Mọi kết nối qua mạng (postgres_fdw, nạp, kiểm tra, đo, nhập liệu, dashboard) dùng TLS ≥ 1.3, sslmode=verify-full.
[tls]
enabled   = true
domain    = "db.nhom8.internal"   # tên nút: <nút>.db.nhom8.internal (SAN trong chứng chỉ máy chủ, không có IP)
cert_days = 90                    # hạn chứng chỉ trạm; `make tls-status` cảnh báo khi còn < 30 ngày
